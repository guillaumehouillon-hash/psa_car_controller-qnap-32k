# docker-compose pour psa_car_controller sur QNAP ARM 32K
# Image : guillaumehouillon-hash/psa_car_controller_gh

services:
  psacc:
    image: guillaumehouillon-hash/psa_car_controller_gh:latest
    container_name: psa_car_controller
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PSACC_VERSION: "3.6.3"
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
    environment:
      - PSACC_PORT=5000
      - PSACC_OPTIONS=-c -r --web-conf
      - PSACC_BASE_PATH=/
      - PSACC_CONFIG_DIR=/config
      - PYTHONPATH=/app
      # Fix pour jemalloc + 32K page-size sur QNAP
      - MALLOC_CHECK_=0
      - LD_PRELOAD=
    # Uncomment si besoin pour accès réseau complet sur QNAP
    # network_mode: host
    # Uncomment si besoin pour accès hardware complet
    # privileged: true
