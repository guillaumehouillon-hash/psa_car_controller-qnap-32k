services:
  psacc:
    image: guillaumehouillon-hash/psa_car_controller-qnap-32k:latest
    container_name: psa_car_controller
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
    environment:
      - PSACC_PORT=5000
      - PSACC_BASE_PATH=/
      - PSACC_OPTIONS=-c -r --web-conf
      - PSACC_CONFIG_DIR=/config
      - MALLOC_CHECK_=0
